# MewCode 配置示例（请复制为 config.yaml）
# 项目路径：./.mewcode/config.yaml（优先）
# 用户路径：~/.mewcode/config.yaml
#
# API Key 注入方式（优先级从高到低）：
# 1. 环境变量 MEWCODE_<供应商名>_API_KEY（如 MEWCODE_DEEPSEEK_API_KEY）
# 2. 环境变量 MEWCODE_API_KEY（覆盖当前 active 供应商）
# 3. 下方 api_key 字段（支持 ${VAR} 引用环境变量）

active: deepseek

providers:
  - name: deepseek
    protocol: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    # 本地可直接写密钥；Docker / CI 建议用环境变量，此处可留占位
    api_key: ${MEWCODE_API_KEY}
    # context_window: 128000  # 上下文窗口 token 上限，缺省 128000
    # thinking: true  # openai 协议不支持，开启时会告警并忽略

  # - name: anthropic
  #   protocol: anthropic
  #   model: claude-sonnet-4-20250514
  #   base_url: https://api.anthropic.com
  #   api_key: ${MEWCODE_ANTHROPIC_API_KEY}
  #   thinking: true

