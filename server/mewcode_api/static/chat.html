<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MewCode</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #6d655c;
      --line: #ddd4c6;
      --panel: #fffdf8;
      --accent: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header, main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .workspace {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 16px;
    }
    .stage { flex: 1; min-width: 0; }
    .history {
      width: 220px;
      flex: none;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    @media (max-width: 800px) {
      .workspace { flex-direction: row; }
      .history { width: 132px; }
    }
    header { padding-bottom: 0; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0; }
    form, .history, .thread {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    label { display: block; font-size: 13px; margin: 10px 0 4px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: white;
    }
    textarea { min-height: 88px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { margin: 0 0 12px; }
    .msg strong { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .bubble {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .approval { margin-top: 8px; }
    .approval .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tool {
      font-size: 13px;
      color: var(--muted);
      border-left: 3px solid var(--line);
      padding: 4px 8px;
      margin: 6px 0;
    }
    .history button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 8px 0;
    }
    .status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>MewCode</h1>
    <p>本地 Coding Agent。文字会在任务结束前逐步出现。</p>
  </header>
  <main>
    <div class="workspace">
      <section class="history">
        <strong>对话</strong>
        <div id="history"></div>
      </section>
      <div class="stage">
        <form id="composer">
          <label for="workspace">工作区</label>
          <input id="workspace" name="workspace" placeholder="留空则使用服务端当前目录" />
          <label for="token">访问令牌</label>
          <input id="token" name="token" type="password" placeholder="未设置 MEWCODE_SERVER_TOKEN 时留空" />
          <label for="prompt">任务</label>
          <textarea id="prompt" name="prompt" required placeholder="说明要做的修改"></textarea>
          <div class="row">
            <button type="submit" id="send">发送</button>
            <button type="button" class="secondary" id="create">新建对话</button>
            <button type="button" class="secondary" id="refresh">刷新对话</button>
          </div>
          <p class="status" id="status"></p>
        </form>
        <section class="thread" id="thread"></section>
      </div>
    </div>
  </main>
  <script>
    const workspaceInput = document.querySelector("#workspace");
    const tokenInput = document.querySelector("#token");
    const promptInput = document.querySelector("#prompt");
    const statusNode = document.querySelector("#status");
    const thread = document.querySelector("#thread");
    const historyNode = document.querySelector("#history");
    const sendButton = document.querySelector("#send");
    let currentSessionId = "";

    workspaceInput.value = localStorage.getItem("mewcode.workspace") || "";
    tokenInput.value = localStorage.getItem("mewcode.token") || "";

    function authHeaders() {
      const headers = { "Content-Type": "application/json" };
      const token = tokenInput.value.trim();
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function remember() {
      localStorage.setItem("mewcode.workspace", workspaceInput.value.trim());
      localStorage.setItem("mewcode.token", tokenInput.value.trim());
    }

    function workspaceQuery() {
      const workspace = workspaceInput.value.trim();
      if (!workspace) return "";
      return "?workspace=" + encodeURIComponent(workspace);
    }

    function workspacePayload(extra) {
      const payload = extra || {};
      const workspace = workspaceInput.value.trim();
      if (workspace) payload.workspace = workspace;
      return payload;
    }

    function addBlock(title, className) {
      const wrap = document.createElement("div");
      wrap.className = "msg";
      const label = document.createElement("strong");
      label.textContent = title;
      const body = document.createElement("div");
      body.className = className;
      wrap.append(label, body);
      thread.append(wrap);
      return body;
    }

    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          if (!part.trim() || part.startsWith(":")) continue;
          let event = "message";
          const data = [];
          for (const line of part.split("\n")) {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) data.push(line.slice(5).trim());
          }
          if (!data.length) continue;
          onEvent(event, JSON.parse(data.join("\n")));
        }
      }
    }

    function showMessages(messages) {
      thread.replaceChildren();
      for (const message of messages) {
        const title = message.role === "user" ? "你" : "MewCode";
        const body = addBlock(title, "bubble");
        body.textContent = message.content || "";
      }
    }

    async function openSession(sessionId) {
      currentSessionId = sessionId;
      remember();
      const response = await fetch(
        "/v1/sessions/" + encodeURIComponent(sessionId) + workspaceQuery(),
        { headers: authHeaders() },
      );
      if (!response.ok) {
        statusNode.textContent = "无法打开对话：" + (await response.text());
        return;
      }
      const detail = await response.json();
      showMessages(detail.messages || []);
      statusNode.textContent = detail.busy ? "这段对话正忙" : detail.label;
    }

    async function refreshSessions() {
      historyNode.replaceChildren();
      const response = await fetch("/v1/sessions" + workspaceQuery(), {
        headers: authHeaders(),
      });
      if (!response.ok) {
        historyNode.textContent = "对话暂时不可用";
        return;
      }
      const sessions = await response.json();
      if (!sessions.length) {
        historyNode.textContent = "还没有对话";
        return;
      }
      for (const session of sessions) {
        const button = document.createElement("button");
        button.type = "button";
        const mark = session.busy ? "进行中 · " : "";
        button.textContent = mark + (session.label || "新对话");
        button.addEventListener("click", () => {
          openSession(session.sessionId);
        });
        historyNode.append(button);
      }
    }

    document.querySelector("#create").addEventListener("click", async () => {
      remember();
      const response = await fetch("/v1/sessions", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(workspacePayload({})),
      });
      if (!response.ok) {
        statusNode.textContent = "无法新建对话：" + (await response.text());
        return;
      }
      const created = await response.json();
      await refreshSessions();
      await openSession(created.sessionId);
    });

    document.querySelector("#composer").addEventListener("submit", async (event) => {
      event.preventDefault();
      remember();
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      if (!currentSessionId) {
        statusNode.textContent = "请先新建或选择一段对话";
        return;
      }
      sendButton.disabled = true;
      statusNode.textContent = "发送中";
      try {
        const created = await fetch(
          "/v1/sessions/" + encodeURIComponent(currentSessionId) + "/messages",
          {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify(workspacePayload({ prompt })),
          },
        );
        if (created.status === 409) {
          statusNode.textContent = "这段对话正忙";
          return;
        }
        if (!created.ok) {
          statusNode.textContent = "提交失败：" + (await created.text());
          return;
        }
        const run = await created.json();
        const user = addBlock("你", "bubble");
        user.textContent = prompt;
        const assistant = addBlock("MewCode", "bubble");
        statusNode.textContent = "运行中 " + run.runId;
        promptInput.value = "";
        let approvalBox = null;
        let approvalSettled = false;
        function markApprovalDenied() {
          if (!approvalBox || approvalSettled) return;
          approvalSettled = true;
          approvalBox.textContent = "已拒绝";
        }
        const stream = await fetch("/v1/runs/" + run.runId + "/events", {
          headers: authHeaders(),
        });
        if (!stream.ok || !stream.body) {
          statusNode.textContent = "无法订阅事件";
          return;
        }
        await readSse(stream, (name, data) => {
          if (name === "text" && data.delta) {
            let span = assistant.querySelector(".delta");
            if (!span) {
              span = document.createElement("span");
              span.className = "delta";
              assistant.prepend(span);
            }
            span.textContent += data.delta;
          }
          if (name === "tool") {
            const line = document.createElement("div");
            line.className = "tool";
            const summary = data.summary ? " " + data.summary : "";
            line.textContent = (data.name || "tool") + " " + (data.phase || "") + summary;
            assistant.append(line);
          }
          if (name === "warning" && data.message) {
            const line = document.createElement("div");
            line.className = "tool";
            line.textContent = data.message;
            assistant.append(line);
          }
          if (name === "approval" && data.status === "pending") {
            approvalSettled = false;
            approvalBox = document.createElement("div");
            approvalBox.className = "approval";
            const info = document.createElement("div");
            info.textContent = [data.tool, data.subject, data.argsSummary].filter(Boolean).join(" ");
            const choices = document.createElement("div");
            choices.className = "choices";
            const labels = {
              deny: "拒绝",
              once: "仅本次放行",
              session: "本会话放行",
              permanent: "永久放行",
            };
            for (const choice of data.choices || ["deny", "once", "session", "permanent"]) {
              const button = document.createElement("button");
              button.type = "button";
              button.textContent = labels[choice] || choice;
              button.addEventListener("click", async () => {
                approvalSettled = true;
                choices.remove();
                await fetch("/v1/runs/" + run.runId + "/approval", {
                  method: "POST",
                  headers: authHeaders(),
                  body: JSON.stringify({ approvalId: data.approvalId, choice }),
                });
              });
              choices.append(button);
            }
            approvalBox.append(info, choices);
            assistant.append(approvalBox);
          }
          if (name === "approval" && data.status === "allowed") {
            approvalSettled = true;
            const choices = approvalBox && approvalBox.querySelector(".choices");
            if (choices) choices.remove();
          }
          if (name === "approval" && data.status === "denied" && !approvalSettled) {
            markApprovalDenied();
          }
          if (name === "done") {
            markApprovalDenied();
            const span = assistant.querySelector(".delta");
            if ((!span || !span.textContent) && data.text) {
              const next = document.createElement("span");
              next.className = "delta";
              next.textContent = data.text;
              assistant.prepend(next);
            }
            statusNode.textContent = data.status + (data.error ? "：" + data.error : "");
            remember();
          }
        });
        await refreshSessions();
      } catch (err) {
        statusNode.textContent = "请求失败";
      } finally {
        sendButton.disabled = false;
      }
    });

    document.querySelector("#refresh").addEventListener("click", refreshSessions);
    workspaceInput.addEventListener("change", refreshSessions);
    refreshSessions();
  </script>
</body>
</html>
